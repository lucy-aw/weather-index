<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>London</title>
<!-- Fonts: Cormorant Garamond and Baskervville. Choose which one is used with --font below. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baskervville&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     LOOK & FEEL
     The little gradient box's colours live in SKY_KEYFRAMES in the script.
     ========================================================= */
  :root {
    --size: 19px;                                   /* one text size for everything */
    /* ONE FONT FOR EVERYTHING. To switch, swap these two lines for the commented-out pair. */
    --font: "Baskervville", Georgia, serif;     --scale: 1;     --weight: 400;
    /* --font: "Cormorant Garamond", Georgia, serif;  --scale: 1.12;  --weight: 500; */
    --top: #3d8fe6; --bottom: #9fd0f7;              /* set by the script */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #fff; color: #000; -webkit-font-smoothing: antialiased; }

  /* Two halves; the left line sits level with the first line of the quote */
  main {
    min-height: calc(100vh - 2.6rem); display: grid; grid-template-columns: 1fr 1fr;
    align-content: center; align-items: baseline;
    padding: 4rem 5vw; column-gap: 5vw;
  }

  .now {
    font-family: var(--font); font-size: calc(var(--size) * var(--scale));  /* --scale evens out fonts that run small */
    font-weight: var(--weight); line-height: 1.3;
  }
  .nobr { white-space: nowrap; }
  .swatch {
    display: inline-block; width: .8em; height: .8em; margin-left: .45em;
    vertical-align: -.05em;
    background: linear-gradient(180deg, var(--top), var(--bottom));
  }

  .quote { margin: 0; max-width: 30rem; justify-self: start; transition: opacity 1.2s ease; }
  .quote-text {
    font-family: var(--font); font-size: calc(var(--size) * var(--scale)); font-weight: var(--weight); line-height: 1.3;
    text-align: left; white-space: pre-line;   /* keeps the line breaks from your spreadsheet */
  }
  .quote-author {
    display: block; margin-top: 1.3em;
    font-family: var(--font); font-style: normal; font-size: calc(var(--size) * var(--scale)); font-weight: var(--weight);
  }
  .quote-author:not(:empty)::before { content: "- "; }
  .fade { opacity: 0; }

  footer { padding: 0 5vw 1.2rem; font-family: var(--font); font-size: 12px; color: #b5b5b5; }
  footer a { color: inherit; text-decoration: none; }

  /* Phones: stack */
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; row-gap: 3rem; align-content: center; padding: 3rem 1.5rem; }
    footer { padding-left: 1.5rem; }
    /* Keep the time line pinned to the top while a long quote scrolls underneath */
    .now {
      position: sticky; top: 0; z-index: 1; background: #fff;
      padding: 1.25rem 0 .75rem; margin-top: -1.25rem;
    }
    .now::after {   /* soft fade so the text slides under gently */
      content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 1.5rem;
      background: linear-gradient(#fff, rgba(255,255,255,0)); pointer-events: none;
    }
  }
</style>
</head>
<body>
<main>
  <div class="now" id="now">&nbsp;</div>
  <blockquote class="quote" id="quote">
    <div class="quote-text" id="quote-text"></div>
    <cite class="quote-author" id="quote-author"></cite>
  </blockquote>
</main>
<footer>Weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>

<script>
/* ===================== SETTINGS ===================== */
const LAT = 51.5072, LON = -0.1276;          // London
const LOCATION_NAME   = "London";
const TIMEZONE        = "Europe/London";     // clock + sky follow London time

/* ---- Sky colours through the day ----
   Each point has a top colour, bottom colour and text colour.
   "at" is either a clock time ("00:00") or relative to today's real
   sunrise/sunset ("sunrise-60" = an hour before sunrise, in minutes).
   The page blends smoothly between neighbouring points.            */
const SKY_KEYFRAMES = [
  { name: "midnight",  at: "00:00",       top: "#0d1240", bottom: "#2b3080" },  // deep indigo
  { name: "pre-dawn",  at: "sunrise-70",  top: "#222a76", bottom: "#6d70c2" },  // indigo → periwinkle
  { name: "dawn",      at: "sunrise",     top: "#8ea4e2", bottom: "#f5b4a6" },  // soft blue → peachy pink
  { name: "morning",   at: "sunrise+90",  top: "#73aaec", bottom: "#f8df92" },  // blue → pale yellow
  { name: "daylight",  at: "noon",        top: "#3d8fe6", bottom: "#a3d3f8" },  // clear blue
  { name: "afternoon", at: "sunset-120",  top: "#3d8fe6", bottom: "#a3d3f8" },  // still blue
  { name: "golden",    at: "sunset-60",   top: "#f7d27a", bottom: "#f5a36c" },  // yellow → orange
  { name: "sunset",    at: "sunset",      top: "#ec93a6", bottom: "#f4843f" },  // peachy pink → orange
  { name: "dusk",      at: "sunset+40",   top: "#6a5fb8", bottom: "#ee9a8e" },  // indigo → peach
  { name: "twilight",  at: "sunset+100",  top: "#272c82", bottom: "#5c60c2" },  // indigo
  { name: "midnight",  at: "24:00",       top: "#0d1240", bottom: "#2b3080" },
]
// Used until the real times arrive (or if the weather service is down)
let sunTimes = { sunrise: 7 * 60, sunset: 16 * 60 + 30 };
const QUOTE_MINUTES   = 20;                  // how often the quote changes
const WEATHER_MINUTES = 10;                  // how often weather is re-checked
const QUOTES_FILE     = "quotes.csv";        // exported from your Excel sheet
const USE_NIGHT       = false;               // true = use a "night" category after dark (if you have quotes for it)

/* Autumn: between these dates (month-day), these kinds of weather use the "Autumn" category.
   If you have no Autumn quotes, it falls back to the normal weather category. */
const AUTUMN_WEATHER = ["sunny", "partlycloudy", "cloudy"];
const AUTUMN_START = "10-01";   // 1 October
const AUTUMN_END   = "12-07";   // 7 December (inclusive)

/* Wind thresholds in mph. Weather codes don't include wind, so we check the speed separately. */
const WINDY_SPEED = 20;   // average wind speed that counts as "windy" (about Beaufort force 5)
const WINDY_GUST  = 35;   // or gusts this strong
const GALE_GUST   = 50;   // gusts this strong count as windy even when it's raining

/* Labels + icons for each category (must match the Category column in your sheet) */
const CATEGORY_INFO = {
  sunny:        { label: "Sunny",         icon: "☀️" },
  partlycloudy: { label: "Partly cloudy", icon: "⛅" },
  cloudy:       { label: "Cloudy",        icon: "☁️" },
  rain:         { label: "Raining",       icon: "🌧️" },
  snow:         { label: "Snowing",       icon: "❄️" },
  fog:          { label: "Foggy",         icon: "🌫️" },
  storm:        { label: "Thunderstorm",  icon: "⛈️" },
  windy:        { label: "Windy",         icon: "💨" },
  night:        { label: "Clear night",   icon: "🌙" },
  autumn:       { label: "Autumn",        icon: "🍂" },
};

/* If a category has no quotes, try these instead (in order) */
const FALLBACKS = {
  storm: ["rain"], snow: ["cloudy"], fog: ["cloudy"],
  partlycloudy: ["sunny", "cloudy"], night: ["sunny"], windy: ["cloudy"],
};

/* ============ 1. Turn weather data into a category ============ */
// Open-Meteo uses WMO weather codes: https://open-meteo.com/en/docs
// Priority order: storm > snow > gale > rain > windy > fog > cloud > sun
function categorise(code, isDay, wind = 0, gust = 0) {
  const windy = wind >= WINDY_SPEED || gust >= WINDY_GUST;
  if (code >= 95) return "storm";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
  if (gust >= GALE_GUST) return "windy";
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
  if (windy) return "windy";
  if (code === 45 || code === 48) return "fog";
  if (code === 3) return "cloudy";
  if (code === 1 || code === 2) return "partlycloudy";
  return (USE_NIGHT && !isDay) ? "night" : "sunny";   // code 0 = clear sky
}

// Today's date in London as "MM-DD". Add ?date=10-15 to the address to preview another date.
function londonMonthDay() {
  const preview = new URLSearchParams(location.search).get("date");
  if (preview) return preview;
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: TIMEZONE, month: "2-digit", day: "2-digit" }).formatToParts(new Date());
  return `${p.find(x => x.type === "month").value}-${p.find(x => x.type === "day").value}`;
}

// Swap sunny / partly cloudy / cloudy for Autumn during the autumn dates
function seasonal(category) {
  const today = londonMonthDay();
  if (AUTUMN_WEATHER.includes(category) && today >= AUTUMN_START && today <= AUTUMN_END) return "autumn";
  return category;
}

async function getWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
              `&current=temperature_2m,weather_code,is_day,wind_speed_10m,wind_gusts_10m` +
              `&daily=sunrise,sunset&forecast_days=1` +
              `&wind_speed_unit=mph&timezone=${encodeURIComponent(TIMEZONE)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Weather request failed");
  const data = await res.json(), c = data.current;
  const base = categorise(c.weather_code, c.is_day === 1, c.wind_speed_10m, c.wind_gusts_10m);
  // "2026-11-20T07:31" -> minutes since midnight
  const toMins = iso => { const [h, m] = iso.split("T")[1].split(":").map(Number); return h * 60 + m; };
  if (data.daily?.sunrise?.[0]) sunTimes = { sunrise: toMins(data.daily.sunrise[0]), sunset: toMins(data.daily.sunset[0]) };
  return {
    base: base,                 // the actual weather (shown on the page)
    category: seasonal(base),   // the quote category (may be Autumn)
    temp: Math.round(c.temperature_2m),
    wind: Math.round(c.wind_speed_10m),
  };
}

/* ============ 2. Load quotes from the CSV ============ */
// Small CSV parser that copes with commas, quotes and line breaks inside cells
function parseCSV(text) {
  text = text.replace(/^﻿/, "");               // strip Excel's BOM
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else field += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += ch;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => cell.trim() !== ""));
}

const normaliseCategory = s => s.toLowerCase().replace(/[^a-z]/g, "");  // "Partly Cloudy" -> "partlycloudy"

async function loadQuotes() {
  const res = await fetch(QUOTES_FILE, { cache: "no-store" });
  if (!res.ok) throw new Error("Couldn't load " + QUOTES_FILE);
  const [header, ...rows] = parseCSV(await res.text());
  const col = name => header.findIndex(h => h.trim().toLowerCase() === name);
  const cCat = col("category"), cQuote = col("quote"), cAuthor = col("author");
  const byCategory = {};
  for (const r of rows) {
    const cat = normaliseCategory(r[cCat] || ""), quote = (r[cQuote] || "").trim();
    if (!cat || !quote) continue;
    (byCategory[cat] ||= []).push({ quote, author: cAuthor >= 0 ? (r[cAuthor] || "").trim() : "" });
  }
  return byCategory;
}

/* ============ 3. Rotate without repeating ============ */
// "Shuffle bag": every quote in a category is shown once (in random order)
// before any repeats. The bag is saved in the browser so reloading the page
// carries on where it left off.
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function loadState() { try { return JSON.parse(localStorage.getItem("wq-bags")) || {}; } catch { return {}; } }
function saveState(s) { try { localStorage.setItem("wq-bags", JSON.stringify(s)); } catch {} }

function nextQuote(category, quotes) {
  const list = quotes[category];
  const state = loadState();
  let bag = state[category];
  // Rebuild the bag if it's empty or the spreadsheet changed size
  if (!bag || !bag.order || bag.order.length === 0 || bag.size !== list.length) {
    let order = shuffle([...list.keys()]);
    // Don't let the first quote of a new round equal the last one shown
    if (list.length > 1 && bag && order[0] === bag.last) order.push(order.shift());
    bag = { order, size: list.length, last: bag?.last };
  }
  const idx = bag.order.shift();
  bag.last = idx; state[category] = bag; saveState(state);
  return list[idx];
}

function pickCategory(cat, quotes, base) {
  for (const c of [cat, ...(base && base !== cat ? [base] : []), ...(FALLBACKS[base || cat] || []), ...(FALLBACKS[cat] || [])]) if (quotes[c]?.length) return c;
  return Object.keys(quotes)[0];   // last resort: anything
}

/* ============ 4. Sky gradient + clock ============ */
// Add ?time=19:30 to the address to preview any time of day
const PREVIEW_TIME = new URLSearchParams(location.search).get("time");

function londonMinutes() {
  if (PREVIEW_TIME) { const [h, m] = PREVIEW_TIME.split(":").map(Number); return h * 60 + (m || 0); }
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: TIMEZONE, hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date());
  const get = t => Number(parts.find(p => p.type === t).value);
  return get("hour") * 60 + get("minute");
}

function keyframeMinute(at) {
  const noon = Math.round((sunTimes.sunrise + sunTimes.sunset) / 2);   // solar midday
  const m = at.match(/^(sunrise|sunset|noon)([+-]\d+)?$/);
  if (m) return ({ sunrise: sunTimes.sunrise, sunset: sunTimes.sunset, noon })[m[1]] + Number(m[2] || 0);
  const [h, mm] = at.split(":").map(Number);
  return h * 60 + mm;
}

const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; };
const ease = t => t * t * (3 - 2 * t);   // smoothstep, so changes feel gentle

function updateSky() {
  const now = londonMinutes();
  const frames = SKY_KEYFRAMES.map(f => ({ ...f, min: keyframeMinute(f.at) })).sort((x, y) => x.min - y.min);
  let i = frames.findIndex(f => f.min > now);
  if (i <= 0) i = frames.length - 1;
  const from = frames[i - 1], to = frames[i];
  const t = ease(Math.min(1, Math.max(0, (now - from.min) / ((to.min - from.min) || 1))));
  const root = document.documentElement.style;
  root.setProperty("--top", mix(from.top, to.top, t));
  root.setProperty("--bottom", mix(from.bottom, to.bottom, t));
}

// "4:48pm, Thursday 18 November, London"
function updateClock() {
  let h, m;
  if (PREVIEW_TIME) [h, m] = PREVIEW_TIME.split(":").map(Number);
  else {
    const p = new Intl.DateTimeFormat("en-GB", { timeZone: TIMEZONE, hour: "numeric", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
    h = Number(p.find(x => x.type === "hour").value); m = Number(p.find(x => x.type === "minute").value);
  }
  const time = `${h % 12 || 12}:${String(m).padStart(2, "0")}${h < 12 ? "am" : "pm"}`;
  const date = new Intl.DateTimeFormat("en-GB", { timeZone: TIMEZONE, weekday: "long", day: "numeric", month: "long" })
    .format(new Date()).replace(",", "");
  // The last word and the colour box are kept together so the box never ends up on a line alone
  const text = `${time}, ${date}, ${LOCATION_NAME}`;
  const cut = text.lastIndexOf(" ");
  const now = $("now");
  if (now.dataset.text !== text) {
    now.dataset.text = text;
    now.innerHTML = "";
    now.append(text.slice(0, cut + 1));
    const keep = document.createElement("span");
    keep.className = "nobr";
    keep.append(text.slice(cut + 1));
    const box = document.createElement("span");
    box.className = "swatch"; box.setAttribute("aria-hidden", "true");
    keep.append(box);
    now.append(keep);
  }
}

/* ============ 5. Put it on the page ============ */
let quotes = {}, weather = null, timer = null;
const $ = id => document.getElementById(id);

function showWeather() {
  updateSky();   // sunrise/sunset may have just arrived
}

function showQuote() {
  const cat = pickCategory(weather.category, quotes, weather.base);
  if (!cat) { $("quote-text").textContent = "No quotes found — check quotes.csv"; return; }
  const q = nextQuote(cat, quotes);
  const box = $("quote");
  box.classList.add("fade");
  setTimeout(() => {
    $("quote-text").textContent = q.quote.replace(/\r\n?/g, "\n");
    $("quote-author").textContent = q.author;
    box.classList.remove("fade");
  }, 1200);
}

async function refreshWeather() {
  try {
    const old = weather?.category;
    weather = await getWeather();
    showWeather();
    if (old !== weather.category) { showQuote(); restartTimer(); }  // weather changed → new quote now
  } catch (e) {
    console.error(e);
    if (!weather) { weather = { category: "cloudy", temp: "--" }; showWeather(); showQuote(); restartTimer(); }
  }
}

function restartTimer() { clearInterval(timer); timer = setInterval(showQuote, QUOTE_MINUTES * 60 * 1000); }

(async function start() {
  updateClock(); updateSky();
  setInterval(() => { updateClock(); updateSky(); }, 1000);
  try { quotes = await loadQuotes(); }
  catch (e) { $("quote-text").textContent = e.message + " (are you opening the file directly? see README)"; return; }
  await refreshWeather();
  setInterval(refreshWeather, WEATHER_MINUTES * 60 * 1000);
})();
</script>
</body>
</html>
